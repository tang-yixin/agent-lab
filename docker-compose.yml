services:
  hadoop:
    image: apache/hadoop:3.4.1
    container_name: lab2-hadoop
    hostname: lab2-hadoop
    ports:
      - "9870:9870"   # NameNode Web UI
      - "8088:8088"   # ResourceManager Web UI
      - "9864:9864"   # DataNode Web UI
      - "9000:9000"   # HDFS RPC
    volumes:
      # 挂载自定义配置，覆盖镜像默认（单节点伪分布式）
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./config/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./config/hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      # 挂载启动脚本
      - ./scripts/start-hadoop.sh:/opt/start-hadoop.sh:ro
      # 挂载 MapReduce 作业 jar（随容器自动恢复，无需每次 docker cp）
      - ./src/hadoop/target/hadoop-jobs.jar:/opt/hadoop-jobs.jar:ro
      # 数据卷：HDFS 元数据/数据块 + 待处理数据
      - hadoop-data:/data
      - ./ml-1m:/data/raw:ro
    environment:
      - ENSURE_NAMENODE_DIR=/data/hdfs/name
    # 覆盖镜像默认 entrypoint（starter.sh），改用我们的启动脚本
    entrypoint: ["/bin/bash", "/opt/start-hadoop.sh"]

volumes:
  hadoop-data:
